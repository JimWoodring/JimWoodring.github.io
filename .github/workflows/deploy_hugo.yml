name: Desplegar Blog Hugo en GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Instalar Tema PaperMod
        run: |
          mkdir -p themes
          git clone https://github.com/adityatelange/hugo-PaperMod.git themes/PaperMod --depth=1

      - name: Asegurar estructura de contenidos
        run: |
          mkdir -p content/posts
          if [ ! "$(ls -A content/posts)" ]; then
            echo -e "---\ntitle: \"Bienvenido\"\ndate: $(date -u +%Y-%m-%dT%H:%M:%SZ)\ndraft: false\n---\n\nPrimer artículo del blog." > content/posts/index.md
          fi

      - name: Configurar Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Construir sitio web
        run: hugo --minify

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
