name: Publicar Reseñas de Letterboxd

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar dependencias
        run: |
          pip install feedparser requests google-genai

      - name: Procesar RSS y generar entradas con IA
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LETTERBOXD_USER: 'DiegoooMP'
        run: |
          python - << 'EOF'
          import os
          import re
          import feedparser
          from datetime import datetime
          from google import genai

          api_key = os.environ.get("GEMINI_API_KEY")
          user = os.environ.get("LETTERBOXD_USER")
          client = genai.Client(api_key=api_key)

          rss_url = f"https://letterboxd.com/{user}/rss/"
          print(f"Consultando RSS de: {rss_url}")
          feed = feedparser.parse(rss_url)

          os.makedirs("content/posts", exist_ok=True)

          if not feed.entries:
              print("No se encontraron entradas en el canal RSS.")

          for entry in feed.entries:
              title = entry.title
              summary_html = entry.get("summary", "")
              
              clean_text = re.sub(r'<[^>]+>', '', summary_html).strip()
              print(f"\nEvaluando entrada: '{title}'")

              # Buscar la palabra 'blog' independientemente de mayúsculas/minúsculas o puntuación
              if not re.search(r'\bblog\b', clean_text, re.IGNORECASE):
                  print("  -> Omitida: No contiene la palabra 'BLOG'.")
                  continue

              # Extraer imagen cubriendo extensiones comunes
              image_match = re.search(r'src="(https://[^"]+\.(?:jpg|jpeg|png))"', summary_html)
              image_url = image_match.group(1) if image_match else ""

              slug = re.sub(r'[^a-zA-Z0-9]', '-', title).lower().strip('-')
              filepath = f"content/posts/{slug}.md"

              if os.path.exists(filepath):
                  print(f"  -> Omitida: La entrada {filepath} ya existe.")
                  continue

              print(f"  -> Generando entrada para: {title}")

              prompt = f"""
              Toma la siguiente reseña/información de una película obtenida de Letterboxd:
              Título: {title}
              Contenido original: {summary_html}
              Imagen del cartel: {image_url}

              Instrucciones:
              1. Limpia el texto eliminando etiquetas HTML y borra la palabra clave "BLOG" (y signos de puntuación pegados a ella) si aparece.
              2. Divide el texto en párrafos bien estructurados.
              3. Si hay imagen ({image_url}), insértala formateada en Markdown entre el primer y el segundo párrafo: ![Poster]({image_url})
              4. Devuelve el resultado en formato Markdown listo para publicar en un blog.
              """

              try:
                  response = client.models.generate_content(
                      model="gemini-2.5-flash",
                      contents=prompt
                  )
                  
                  now = datetime.now().strftime("%Y-%m-%dT%H:%M:%S+00:00")

                  with open(filepath, "w", encoding="utf-8") as f:
                      f.write(f'---\ntitle: "{title}"\ndate: {now}\ndraft: false\n---\n\n')
                      f.write(response.text)
                  print("  -> ¡Entrada guardada con éxito!")
              except Exception as e:
                  print(f"  -> Error al generar contenido con IA: {e}")

          EOF

      - name: Guardar cambios en el repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Añadir nueva reseña desde Letterboxd" && git push)
